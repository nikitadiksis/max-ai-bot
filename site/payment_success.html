<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Оплата принята</title>
  <meta name="description" content="Статус оплаты подписки AI-бота в MAX." />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <main class="wrap">
    <section class="card payment-card">
      <div class="top">
        <span class="badge">Оплата подписки</span>
        <span class="badge">Т-Банк</span>
      </div>
      <h1 id="status-title">Платеж отправлен</h1>
      <p id="status-message">Проверяем подтверждение от банка. Обычно это занимает до 1-2 минут.</p>

      <article class="tile">
        <strong>Детали</strong>
        <p>Заявка: <code id="request-id">—</code></p>
        <p>Статус: <span id="status-badge" class="status-pill pending">Ожидает оплату</span></p>
        <p id="bank-status-row" hidden>Статус банка: <span id="bank-status">—</span></p>
      </article>

      <div class="actions">
        <a class="btn btn-primary" href="https://max.ru/id231128398751_biz" target="_blank" rel="noopener">Открыть MAX</a>
        <a class="btn" href="/">На главную</a>
        <a class="btn" href="/support">Помощь</a>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const requestId = params.get("request_id");
    const titleEl = document.getElementById("status-title");
    const messageEl = document.getElementById("status-message");
    const requestEl = document.getElementById("request-id");
    const badgeEl = document.getElementById("status-badge");
    const bankStatusRowEl = document.getElementById("bank-status-row");
    const bankStatusEl = document.getElementById("bank-status");
    requestEl.textContent = requestId || "не передан";

    function paintStatus(status, statusLabel) {
      badgeEl.className = "status-pill " + (status || "unknown");
      badgeEl.textContent = statusLabel || status || "Статус обновляется";
    }

    function paintBankStatus(bankStatus) {
      if (!bankStatus) {
        bankStatusRowEl.hidden = true;
        bankStatusEl.textContent = "—";
        return;
      }
      bankStatusRowEl.hidden = false;
      bankStatusEl.textContent = bankStatus;
    }

    async function refreshStatus() {
      const qs = requestId ? ("?request_id=" + encodeURIComponent(requestId)) : "";
      try {
        const resp = await fetch("/payment/status" + qs, { cache: "no-store" });
        const data = await resp.json();
        titleEl.textContent = data.title || "Статус оплаты";
        messageEl.textContent = data.message || "Проверяем оплату.";
        paintStatus(data.status, data.status_label);
        paintBankStatus(data.bank_status || "");
      } catch (_) {
        titleEl.textContent = "Проверяем оплату";
        messageEl.textContent = "Связь нестабильна. Обнови страницу через 10-20 секунд.";
        paintStatus("unknown", "Неизвестно");
        paintBankStatus("");
      }
    }

    refreshStatus();
    setInterval(refreshStatus, 4000);
  </script>
</body>
</html>
