name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: max-ai-bot-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # Prevent overlapping deploy sessions on the VPS itself.
            exec 9>/var/lock/max_ai_agent_deploy.lock
            if ! flock -n 9; then
              echo "Another deploy is already running. Exiting."
              exit 0
            fi

            if ! command -v git >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y git curl
            elif ! command -v curl >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y curl
            fi

            mkdir -p /root/max_ai_agent
            cd /root/max_ai_agent

            rm -rf .deploy_tmp
            git clone --depth 1 https://github.com/nikitadiksis/max-ai-bot.git .deploy_tmp

            find /root/max_ai_agent -mindepth 1 -maxdepth 1 \
              ! -name '.env' \
              ! -name 'data' \
              ! -name 'logs' \
              ! -name 'backups' \
              ! -name '.deploy_tmp' \
              -exec rm -rf {} +

            cp -a /root/max_ai_agent/.deploy_tmp/. /root/max_ai_agent/
            rm -rf /root/max_ai_agent/.deploy_tmp

            docker compose -f /root/max_ai_agent/docker-compose.yml up -d --build bot
            docker compose -f /root/max_ai_agent/docker-compose.yml ps
            curl -fsS http://127.0.0.1:8000/health
